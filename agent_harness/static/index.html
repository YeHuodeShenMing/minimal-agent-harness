<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="一个从零实现的 Agent：真实模型、工具调用、独立会话与可观察的执行过程。"><title>Minimal Agent · 演示台</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/static/style.css"><script defer src="/static/marked.umd.js"></script><script defer src="/static/purify.min.js"></script><script defer src="/static/markdown.js"></script><script defer src="/static/app.js"></script></head>
<body>
<div id="login-screen" class="login-screen"><div class="login-card"><div class="brand-mark">m<span>·</span></div><h1>Minimal Agent</h1><p id="login-error" role="status">正在准备你的会话…</p><button id="retry-start" class="primary hidden">重新连接</button></div></div>
<div id="workspace" class="workspace panel-open hidden">
<aside class="sidebar"><div class="brand"><div class="brand-mark small">m<span>·</span></div><div><strong>Minimal Agent</strong></div></div><button id="new-session" class="new-session"><span>＋</span> 新建对话</button><button id="start-guide" class="guide-entry">◎ 新手导览 <span>2 分钟</span></button><div class="section-label">最近对话 <span id="session-count">0</span></div><nav id="sessions" aria-label="会话列表"></nav><div class="sidebar-bottom"><span class="status-dot"></span>专注眼前，交给 Agent。</div></aside>
<main class="main"><header class="topbar"><div><h2 id="session-title">新的开始</h2></div><div class="topbar-actions"><span class="model-badge"><span class="status-dot"></span><span id="model-name">LLM API</span></span><button id="toggle-panel" class="panel-toggle" aria-controls="execution-panel" aria-expanded="true">执行面板 <span>◫</span></button></div></header><div id="conversation" class="conversation" aria-live="polite"></div><div class="composer-wrap"><p id="notice" class="notice" role="status"></p><button id="resume" class="resume hidden">↻ 恢复中断的任务</button><form id="chat-form" class="composer"><textarea id="message" rows="2" maxlength="12000" placeholder="有什么想做的？" aria-label="消息内容"></textarea><div class="composer-bottom"><span>Shift + Enter 换行</span><button id="send" class="send" type="submit" aria-label="发送消息">↑</button></div></form></div></main>
<aside id="execution-panel" class="inspector"><div class="inspector-heading"><h2>执行面板</h2><button id="close-panel" class="close-panel" aria-label="收起执行面板">×</button></div><section><div class="panel-title"><h3>任务状态</h3><span id="run-status" class="pill">就绪</span></div><div class="metrics"><div><strong id="steps">0 / 8</strong><span>决策步数</span></div><div><strong id="context-size">0 KB</strong><span>上下文</span></div></div><progress id="context-progress" value="0" max="48000" aria-label="上下文用量"></progress></section><section><div class="panel-title"><h3>会话待办</h3><span id="todo-count" class="count">0</span></div><div id="todos"></div></section><section class="trace-section"><div class="panel-title"><h3>执行记录</h3></div><div id="trace"></div></section><section><details id="memory"><summary>历史摘要</summary><p id="summary" class="summary">暂无摘要</p></details></section></aside>
</div>
<dialog id="rename-dialog" class="rename-dialog" aria-labelledby="rename-heading">
<form id="rename-form"><h2 id="rename-heading">重命名对话</h2><label class="sr-only" for="rename-title">对话标题</label><input id="rename-title" maxlength="60" required autocomplete="off" placeholder="输入标题"><p id="rename-error" class="error" role="alert"></p><div class="dialog-actions"><button id="rename-cancel" type="button">取消</button><button id="rename-save" type="submit">保存</button></div></form>
</dialog>
<dialog id="guide-dialog" class="rename-dialog guide-dialog" aria-labelledby="guide-title"><div class="guide-top"><span id="guide-progress"></span><button id="guide-close" aria-label="关闭导览">×</button></div><div id="guide-icon" class="spark"></div><h2 id="guide-title"></h2><p id="guide-description"></p><div id="guide-preview"></div><p id="guide-error" class="error" role="alert"></p><button id="guide-action" class="primary"></button><div class="guide-nav"><button id="guide-prev">上一步</button><span id="guide-dots"></span><button id="guide-next">下一步 →</button></div></dialog></body></html>
